[project]
name = "lesson-review-ai"
version = "0.1.0"
description = "Lesson review coach pipeline: transcript, structure, and coaching feedback"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx[socks]>=0.28.1",
    "mlx-whisper>=0.4.3",
    "openai>=2.48.0",
    "python-dotenv>=1.0.0",
    "typer>=0.16.0",
]

[project.scripts]
lesson-review = "lesson_review.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lesson_review"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
